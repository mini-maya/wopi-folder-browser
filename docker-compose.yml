# Local development setup for WOPI Folder Browser + Collabora CODE.
# Host folders are mounted into the container at the paths below.
# The app itself still uses container-internal paths like /documents and /shared.
services:
  app:
    build:
      context: .
    environment:
      PORT: 3000
      DOCUMENT_ROOT: /documents
      WOPI_STATE_ROOT: /var/lib/wopi-state
      SHARED_STORAGE_MODE: ${SHARED_STORAGE_MODE:-disabled}
      # Shared storage mode: auth, readonly, readwrite, or disabled.
      SHARED_STORAGE_ROOT: ${SHARED_STORAGE_ROOT:-/shared}
      # External storage is optional. Manage allowedUserIds via POST /api/admin/external-acl.
      APP_BASE_URL: http://app:3000
      COLLABORA_INTERNAL_URL: http://collabora:9980
      COLLABORA_PUBLIC_URL: http://localhost:9980
      ACCESS_TOKEN_SECRET: change-me-for-real-usage
      SESSION_SECRET: change-me-session-secret
      PASSWORD_MIN_LENGTH: 12
      MAX_DOCUMENT_SIZE: 100mb
    ports:
      - "3000:3000"
    volumes:
      # Host-side defaults: ./wopi_dev_folder/document-storage, shared-storage, external-storage, wopi-state
      - ${DOCUMENTS_HOST_PATH:-./wopi_dev_folder/document-storage}:/documents
      - ${SHARED_STORAGE_HOST_PATH:-./wopi_dev_folder/shared-storage}:/shared
      - ${EXTERNAL_STORAGE_HOST_PATH:-./wopi_dev_folder/external-storage}:/external/storage
      - ${WOPI_STATE_ROOT:-./wopi_dev_folder/wopi-state}:/var/lib/wopi-state
    depends_on:
      - collabora

  collabora:
    image: collabora/code:latest
    environment:
      aliasgroup1: http://app:3000
      extra_params: --o:ssl.enable=false --o:ssl.termination=false --o:welcome.enable=false
      username: admin
      password: adminadmin
    ports:
      - "9980:9980"
