# Production deployment for WOPI Folder Browser behind a TLS-terminating reverse proxy.
# Host folders are required and must exist before Docker starts.
services:
  app:
    image: ghcr.io/mini-maya/wopi-folder-browser:latest
    env_file:
      - .env.production
    environment:
      PORT: 3000
      MAX_DOCUMENT_SIZE: 100mb
      NODE_EXTRA_CA_CERTS: /run/certs/collabora-ca.crt
    expose:
      - "3000"
    volumes:
      # Required host folders: document-storage, shared-storage, external-storage, wopi-state
      - /srv/wopi-folder-browser/document-storage:/documents
      - /srv/wopi-folder-browser/shared-storage:/shared
      - /srv/wopi-folder-browser/external-storage:/external/storage
      - /srv/wopi-folder-browser/certs/ca.crt:/run/certs/collabora-ca.crt:ro
      - /srv/wopi-folder-browser/wopi-state:/var/lib/wopi-state
    restart: unless-stopped
    networks:
      - backend
      - proxy

  collabora:
    image: collabora/code:latest
    env_file:
      - .env.production
    environment:
      aliasgroup1: https://office\\.lan
      extra_params: >-
        --o:ssl.enable=false
        --o:ssl.termination=true
        --o:welcome.enable=false
        --o:server_name=collabora.lan
    expose:
      - "9980"
    restart: unless-stopped
    networks:
      - proxy

networks:
  backend:
  proxy:
    external: true
    name: proxy
