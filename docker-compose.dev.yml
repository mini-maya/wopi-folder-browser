# Local development setup for WOPI Folder Browser + Collabora CODE.
# Builds the app image from the local checkout.
services:
  app:
    build:
      context: .
    environment:
      PORT: 3000
      APP_BASE_URL: http://app:3000
      COLLABORA_INTERNAL_URL: http://collabora:9980
      COLLABORA_PUBLIC_URL: http://localhost:9980
      ACCESS_TOKEN_SECRET: change-me-for-real-usage
      SESSION_SECRET: change-me-session-secret
      PASSWORD_MIN_LENGTH: 4
      MAX_DOCUMENT_SIZE: 100mb
    ports:
      - "3000:3000"
    volumes:
      # Host-side defaults: ./wopi_dev_folder/mounts/documents, projects, archive, wopi-state
      - ./wopi_dev_folder/mounts:/mnt
      - ./wopi_dev_folder/wopi-state:/var/lib/wopi-state
    depends_on:
      - collabora

  collabora:
    image: collabora/code:latest
    environment:
      aliasgroup1: http://app:3000
      extra_params: --o:ssl.enable=false --o:ssl.termination=false --o:welcome.enable=false
      username: admin
      password: adminadmin
    ports:
      - "9980:9980"
